<style>
  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background-color: #5D9F67; 
    color: white;
    padding: 2em;
  }

  body {
    animation: pageFadeIn 0.7s ease-out;
  }

  @keyframes pageFadeIn {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }

  nav {
    margin-bottom: 1em;
  }

  nav a {
    color: #e0f7ea; 
    margin-right: 1em;
    text-decoration: none;
    font-weight: bold;
  }

  nav a:hover {
    text-decoration: underline;
  }

  #donutToggle {
    background: transparent;
    color: #e0f7ea;
    border: 1px solid #e0f7ea;
    border-radius: 6px;
    padding: 6px 10px;
    font-family: 'Poppins', sans-serif;
    font-weight: bold;
    cursor: pointer;
    margin-left: 0.5em;
  }

  #donutToggle:hover {
    opacity: 0.75;
  }

  hr {
    border: none;
    border-top: 1px solid #b2d8c2;
    margin: 1em 0;
  }
</style>

  
<nav>
  <a href="/">Home</a>
  <a href="/about.html">About</a>
  <a href="/contacts.html">Contacts</a>
  <a href="/archive.html">Archive</a>
  <button id="donutToggle">Turn Donuts Off</button>
</nav>
  <hr>
  {{ content }}

  <script>
    { 
      const canvas = document.createElement('canvas');
      canvas.id = "donutCanvas";
      canvas.style = "position:fixed;top:0;left:0;pointer-events:none;z-index:999;";
      document.body.appendChild(canvas);

      const ctx = canvas.getContext('2d');
      let width = window.innerWidth;
      let height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;

      let donuts = [];

      function Donut(x = Math.random() * width, y = -60, xSpeed = 0) {
        this.x = x;
        this.y = y;
        this.xSpeed = xSpeed;
        this.size = 60 + Math.random() * 40;
        this.speed = 0.5 + Math.random() * 1.2;
        this.rotation = Math.random() * 2 * Math.PI;
        this.rotationSpeed = (Math.random() - 0.5) * 0.02;
        this.img = new Image();
        this.img.src = 'https://i.imgur.com/n9eF64v.png';
      }

      function addDonut(x, y, xDrift = 0) {
        donuts.push(new Donut(x, y, xDrift));
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);
        donuts.forEach((donut, index) => {
          donut.y += donut.speed;
          donut.x += donut.xSpeed;
          donut.rotation += donut.rotationSpeed;

          ctx.save();
          ctx.globalAlpha = 1;
          ctx.translate(donut.x, donut.y);
          ctx.rotate(donut.rotation);
          ctx.drawImage(donut.img, -donut.size / 2, -donut.size / 2, donut.size, donut.size);
          ctx.restore();

          if (donut.y > height + 60 || donut.x < -100 || donut.x > width + 100) {
            donuts.splice(index, 1);
          }
        });
        requestAnimationFrame(animate);
      }

      setInterval(() => addDonut(), 600);
      animate();

      window.addEventListener('resize', () => {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
      });

      document.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const clickY = e.clientY - rect.top;

        for (let donut of donuts) {
          const dx = clickX - donut.x;
          const dy = clickY - donut.y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          if (distance < donut.size / 2) {
            for (let i = 0; i < 4; i++) {
              const drift = (Math.random() - 0.5) * 2;
              addDonut(donut.x, donut.y, drift);
            }
            break; 
          }
        }
      });
    }
  </script>
</body>
</html>
